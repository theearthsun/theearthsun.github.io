<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Solar Tree | Site Gamma</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sun-wrapper {
            position: relative;
            text-align: center;
        }

        /* The Sun Image */
        .sun-portal {
            position: relative;
            width: 300px;
            height: 300px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        #main-sun {
            width: 100%;
            border-radius: 50%;
            box-shadow: 0 0 50px #ff4500;
        }

        /* Interaction Zones */
        .zone {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            z-index: 10;
        }
        .left-zone { left: 0; }
        .right-zone { right: 0; }

        /* Pop-out Details */
        .pop-out {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            width: 90%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ff4500;
            padding: 20px;
            z-index: 100;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pop-out.active {
            display: block;
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .pop-out img {
            width: 100%;
            height: auto;
            border: 1px solid #333;
        }

        .close-btn {
            margin-top: 15px;
            color: #ff4500;
            cursor: pointer;
            font-weight: bold;
        }

        #status-text {
            margin-top: 20px;
            font-size: 0.8em;
            letter-spacing: 2px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="sun-wrapper">
    <div class="sun-portal">
        <img src="sun.png" id="main-sun" alt="The Solar Tree">
       
        <div class="zone left-zone" onclick="toggleDetail('tech')"></div>
        <div class="zone right-zone" onclick="toggleDetail('env')"></div>
    </div>
   
    <div id="status-text">Phase Shift 8 013856 | Sovereign Power Active</div>

    <div id="tech-detail" class="pop-out" onclick="this.classList.remove('active')">
        <img src="1000006763.png" alt="Induction Coil Specs">
        <p>THE PHYSICAL ANCHOR: INDUCTION ARRAY</p>
        <div class="close-btn">[ CLOSE ]</div>
    </div>

    <div id="env-detail" class="pop-out" onclick="this.classList.remove('active')">
        <img src="1000006779.png" alt="Site Gamma Buoy">
        <p>THE UNIVERSAL BREATH: SITE GAMMA</p>
        <div class="close-btn">[ CLOSE ]</div>
    </div>
</div>

<script>
    function toggleDetail(type) {
        // Hide both first
        document.getElementById('tech-detail').classList.remove('active');
        document.getElementById('env-detail').classList.remove('active');

        // Show the selected one
        if(type === 'tech') {
            document.getElementById('tech-detail').classList.add('active');
        } else {
            document.getElementById('env-detail').classList.add('active');
        }
    }
</script>

</body>
</html>
